<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Perfil</title>
    <link rel="stylesheet" href="../Css/gerenciarPerfil.css"></head>
<body>
    <section class="perfil-teste">
    <label>ID do Perfil</label>
    <input type="number" id="idPerfil" value="1">
    <button id="btnCarregarPerfil">Carregar Perfil</button>
</section>
    <section class="preview">
        <img id="previewBanner" class="banner">
        <div class="perfil-box">
            <img id="previewAvatar" class="avatar">
            <h2 id="nickname">Meu Perfil</h2>
        </div>
    </section>
    <section>
        <h2>Escolha um Avatar</h2>
        <div id="avatar-list"></div>
    </section>
    <section>
        <h2>Escolha um Banner</h2>
        <div id="banner-list"></div>
    </section>
    <button id="btnSalvar">Salvar Alterações</button>
    <script
        src="../Js/gerenciarPerfil.js">
    </script>
</body>

</html>
